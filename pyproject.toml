[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy-diagnose"
version = "1.4.0-dev"
description = "Read-only native system diagnostics with a Linux platform backend"
requires-python = ">=3.11"

[project.scripts]
lucy-diagnose = "lucy_diagnose.__main__:main"

[tool.setuptools.packages.find]
include = ["lucy_diagnose*"]

[tool.setuptools.package-data]
"lucy_diagnose.themes" = ["*.css"]
