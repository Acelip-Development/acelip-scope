[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acelip-scope"
authors = [{name = "Acelip Development"}]
dynamic = ["version"]
description = "Read-only native system diagnostics with a Linux platform backend"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
acelip-scope = "lucy_diagnose.__main__:main"

[tool.setuptools.packages.find]
include = ["lucy_diagnose*"]

[tool.setuptools.package-data]
"lucy_diagnose" = ["identity.json"]
"lucy_diagnose.themes" = ["*.css"]

[tool.setuptools.dynamic]
version = {attr = "lucy_diagnose.__version__"}
