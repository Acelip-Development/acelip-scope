name: Package development artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Disposable runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak squashfs-tools python3-gi curl binutils librsvg2-common
      - name: Obtain exact locked runtime and AppImage tool
        run: python3 scripts/ci-fetch-inputs.py
      - name: Build twice and verify
        run: |
          scripts/package-all.sh
          scripts/package-all.sh --dist var/reproduction
          cmp dist/SHA256SUMS var/reproduction/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acelip-scope-linux-x86_64-development
          path: dist/
          if-no-files-found: error
          retention-days: 7
