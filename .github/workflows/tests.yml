name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Disposable runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi python3-yaml python3-cairo python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 desktop-file-utils appstream xvfb dbus-x11
      - run: python3 scripts/check-source.py
      - run: python3 -m unittest discover -s tests -v
      - name: Gio integration
        run: python3 -W ignore::DeprecationWarning -m unittest discover -s tests/integration -v
      - run: python3 scripts/check-metadata.py
      - name: Headless GTK smoke (not desktop acceptance)
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo python3 -m lucy_diagnose --smoke-test
      - name: RC2 GTK navigation and responsive views
        env:
          RC2_QA_OUTPUT: var/ci-ui
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1920x1200x24" env GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory G_DEBUG=fatal-criticals python3 -W ignore::DeprecationWarning -m unittest discover -s tests/ui -v
      - name: Upload RC2 UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc2-gauge-ui-screenshots
          path: var/ci-ui/
          if-no-files-found: error
          retention-days: 7
      - name: GTK focus and text scaling
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo G_DEBUG=fatal-criticals python3 scripts/validation/accessibility-smoke.py --output var/ci-accessibility
